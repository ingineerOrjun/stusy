<section id="quiz">
  <div class="sec-head">
    <div class="sec-num">?</div>
    <div>
      <h2>Self-Check Quiz</h2>
      <p class="sec-sub">आफैं जाँच्नुहोस् — प्रश्न अंग्रेजीमै छन्, किनकि परीक्षा अंग्रेजीमै हुन्छ</p>
    </div>
    <span class="marks">15 questions</span>
  </div>
  <div class="rule"></div>
  <p class="sec-sub">Questions are in English because the exam is in English. The explanation after each
  answer is given in both English and Nepali.</p>

  <!-- Phase 9: this page carried neither a limit nor a shuffle, alone
       among the four subjects, so every attempt served the whole bank in
       a fixed order. With 15 questions that was merely repetitive; with
       49 it would be a 49-question paper every time. Now matched to the
       other three: 12 drawn from the bank, reshuffled on each retake. -->
  <div id="quizBox" data-limit="12" data-shuffle="true"></div>
  <div class="score" id="scoreBox" role="status" style="display:none">
    <div class="big" id="scoreNum">0 / 15</div>
    <div id="scoreMsg"></div>
    <div class="np-cell" id="scoreMsgNp"></div>
    <p class="score-focus" id="scoreFocus" hidden></p>
    <div class="btns" style="justify-content:center;margin-top:12px">
      <button class="primary" data-ui="tryAgain" onclick="resetQuiz()">Try again</button>
    </div>
  </div>
</section>
